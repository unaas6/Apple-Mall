
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e1bab3">
  <title>로그인 | Apple Mall</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .login-wrap {
      max-width: 450px;
      margin: 70px auto;
      padding: 0 20px;
    }

    .login-box {
      background: white;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 5px 25px #0000000d;
    }

    .login-box h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .login-desc {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
    }

    .login-form label {
      display: block;
      margin: 18px 0 7px;
      font-weight: bold;
    }

    .login-form input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      box-sizing: border-box;
    }

    .login-form button {
      width: 100%;
      margin-top: 25px;
      border: none;
      cursor: pointer;
    }

    .login-links {
      text-align: center;
      margin-top: 25px;
      color: #777;
      line-height: 2;
    }

    .login-links a {
      color: #9c6259;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="topline">
  Apple Mall · 회원 로그인
</div>

<header class="header">
  <div class="wrap nav">
    <a class="logo" href="index.html">◉ Apple <span>Mall</span></a>
    <a href="index.html" class="pill">쇼핑몰로 돌아가기</a>
  </div>
</header>

<main class="login-wrap">

  <div class="login-box">

    <h1>로그인</h1>

    <p class="login-desc">
      Apple Mall에 오신 것을 환영합니다.
    </p>

    <form id="loginForm" class="login-form">

      <label for="loginEmail">이메일</label>
      <input
        type="email"
        id="loginEmail"
        placeholder="이메일을 입력하세요"
        required
      >

      <label for="loginPassword">비밀번호</label>
      <input
        type="password"
        id="loginPassword"
        placeholder="비밀번호를 입력하세요"
        required
      >

      <button type="submit" class="pill">
        로그인
      </button>

    </form>

    <div class="login-links">
      아직 회원이 아니신가요?
      <a href="signup.html">회원가입</a>
      <br>
      <a href="index.html">쇼핑몰 메인으로 이동</a>
    </div>

  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="db.js"></script>
<script src="login.js"></script>

</body>
</html>
