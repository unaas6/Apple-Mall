
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e1bab3">
  <title>회원가입 | Apple Mall</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .signup-wrap {
      max-width: 480px;
      margin: 60px auto;
      padding: 0 20px;
    }

    .signup-box {
      background: white;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 5px 25px #0000000d;
    }

    .signup-box h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .signup-desc {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
    }

    .signup-form label {
      display: block;
      margin: 17px 0 7px;
      font-weight: bold;
    }

    .signup-form input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      box-sizing: border-box;
    }

    .signup-form button {
      width: 100%;
      margin-top: 25px;
      border: none;
      cursor: pointer;
    }

    .signup-links {
      text-align: center;
      margin-top: 20px;
      color: #777;
    }

    .signup-links a {
      color: #9c6259;
      text-decoration: none;
      font-weight: bold;
    }

    @media(max-width:500px) {
      .signup-box {
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>

<div class="topline">
  신규 회원가입 시 3,000P 지급 · 회원 등급별 최대 7% 적립
</div>

<header class="header">
  <div class="wrap nav">
    <a class="logo" href="index.html">🍎 Apple <span>Mall</span></a>
    <a href="index.html" class="pill">쇼핑몰로 돌아가기</a>
  </div>
</header>

<main class="signup-wrap">

  <div class="signup-box">

    <h1>회원가입</h1>
    <p class="signup-desc">
      Apple Mall에 가입하고 3,000P 혜택을 받아보세요.
    </p>

    <form id="signupForm" class="signup-form">

      <label for="signupName">이름</label>
      <input
        type="text"
        id="signupName"
        placeholder="이름을 입력하세요"
        required
      >

      <label for="signupEmail">이메일</label>
      <input
        type="email"
        id="signupEmail"
        placeholder="example@email.com"
        required
      >

      <label for="signupPhone">전화번호</label>
      <input
        type="tel"
        id="signupPhone"
        placeholder="010-0000-0000"
        required
      >

      <label for="signupPassword">비밀번호</label>
      <input
        type="password"
        id="signupPassword"
        placeholder="비밀번호를 입력하세요"
        minlength="6"
        required
      >

      <label for="signupPasswordCheck">비밀번호 확인</label>
      <input
        type="password"
        id="signupPasswordCheck"
        placeholder="비밀번호를 다시 입력하세요"
        minlength="6"
        required
      >

      <button type="submit" class="pill">
        회원가입하기
      </button>

    </form>

    <div class="signup-links">
      이미 회원이신가요?
      <a href="index.html">로그인</a>
    </div>

  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="db.js"></script>
<script src="signup.js"></script>

</body>
</html>
