<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Apple Mall 관리자</title><link rel="stylesheet" href="style.css"><style>.admin-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.admin-tabs button{padding:10px 16px;border-radius:10px;background:#f7efee}.admin-tabs button.active{background:var(--green);color:white}.admin-table{width:100%;border-collapse:collapse;background:white}.admin-table th,.admin-table td{border-bottom:1px solid var(--line);padding:11px;text-align:left;font-size:12px}.admin-table th{background:#faf6f5}.table-wrap{overflow:auto}.admin-form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.admin-form input,.admin-form select{min-width:0;padding:11px;border:1px solid var(--line);border-radius:9px}.admin-form button{padding:11px;border-radius:9px;background:var(--green);color:#fff}@media(max-width:650px){.admin-form{grid-template-columns:1fr 1fr}}</style></head><body><div class="topline">Apple Mall 관리자 페이지</div><header class="header"><div class="wrap nav"><a class="logo" href="index.html">◉ Apple <span>Mall</span></a><a href="index.html">쇼핑몰로 돌아가기</a><button class="iconbtn" onclick="adminLogout()">↪</button></div></header><main class="wrap section"><h1>관리자 대시보드</h1><p class="section-sub">관리자 권한이 부여된 계정으로 로그인해야 사용할 수 있습니다.</p><div id="adminLogin" class="account-panel"><div class="field"><label>이메일</label><input id="adminEmail" type="email" placeholder="관리자 이메일"></div><div class="field"><label>비밀번호</label><input id="adminPassword" type="password" placeholder="비밀번호"></div><button class="full green" onclick="adminLogin()">관리자 로그인</button></div><div id="adminApp" hidden><div class="account-panel" id="adminWho"></div><div class="admin-tabs"><button class="active" onclick="showAdminTab('products',this)">상품 관리</button><button onclick="showAdminTab('orders',this)">주문 관리</button><button onclick="showAdminTab('members',this)">회원 관리</button></div><section id="adminProducts"><h2>상품 등록 / 수정</h2><div class="admin-form"><input id="pId" placeholder="수정 시 상품 ID"><input id="pName" placeholder="상품명"><input id="pCategory" placeholder="카테고리 (iPad 등)"><input id="pPrice" type="number" placeholder="가격"><input id="pStock" type="number" placeholder="재고"><input id="pImage" placeholder="이미지 경로 (img/...)" value="img/digital-delivery.png"><select id="pActive"><option value="true">판매 중</option><option value="false">판매 중지</option></select><button onclick="saveProduct()">상품 저장</button></div><div class="table-wrap" id="productTable"></div></section><section id="adminOrders" hidden><h2>주문 관리</h2><div class="table-wrap" id="orderTable"></div></section><section id="adminMembers" hidden><h2>회원 관리</h2><p class="muted">회원의 등급·포인트·권한을 변경할 수 있습니다.</p><div class="table-wrap" id="memberTable"></div></section></div></main><div class="toast" id="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="db.js"></script><script src="admin.js"></script></body></html>
