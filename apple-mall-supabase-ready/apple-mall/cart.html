
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e1bab3">
  <title>장바구니 | Apple Mall</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topline">Apple Mall · 장바구니</div>

  <header class="header">
    <div class="wrap nav">
      <a class="logo" href="index.html">🍎 Apple <span>Mall</span></a>
      <a class="pill" href="index.html">쇼핑 계속하기</a>
    </div>
  </header>

  <main class="wrap">
    <section class="section">
      <div class="section-head">
        <div>
          <h2>장바구니</h2>
          <p class="section-sub">담은 상품을 확인하고 주문할 수 있습니다.</p>
        </div>
      </div>

      <div id="cartItems">
        <div class="empty">장바구니를 불러오는 중입니다.</div>
      </div>

      <div class="total">
        <span>총 주문 금액</span>
        <strong id="cartTotal">0원</strong>
      </div>

      <button class="full green" id="checkoutBtn">주문하기</button>
      <p class="notice">
        실제 카드 결제는 지원하지 않습니다.
        주문은 테스트 주문으로 저장됩니다.
      </p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="db.js"></script>
  <script src="cart.js?v=2"></script>
</body>
</html>
