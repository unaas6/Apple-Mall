
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e1bab3">
  <title>주문 및 결제 | Apple Mall</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .checkout-layout {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 24px;
      align-items: start;
    }

    .checkout-panel {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 24px;
      background: #fff;
    }

    .checkout-panel h2 {
      margin: 0 0 18px;
      font-size: 21px;
    }

    .checkout-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      margin-top: 16px;
      font-size: 18px;
      font-weight: 800;
    }

    #payButton:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    @media(max-width:700px) {
      .checkout-layout {
        grid-template-columns: 1fr;
      }

      .checkout-panel {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="topline">Apple Mall · 주문 및 결제</div>

  <header class="header">
    <div class="wrap nav">
      <a class="logo" href="index.html">🍎 Apple <span>Mall</span></a>
      <a class="pill" href="cart.html">장바구니로 돌아가기</a>
    </div>
  </header>

  <main class="wrap">
    <section class="section">

      <div class="section-head">
        <div>
          <h2>주문 정보 입력</h2>
          <p class="section-sub">배송 정보와 결제수단을 확인해 주세요.</p>
        </div>
      </div>

      <div class="checkout-layout">

        <section class="checkout-panel">
          <h2>배송 정보</h2>

          <form id="checkoutForm">

            <div class="field">
              <label for="recipientName">받는 사람 이름 *</label>
              <input
                id="recipientName"
                name="recipientName"
                type="text"
                autocomplete="name"
                required
                maxlength="80"
                placeholder="이름을 입력하세요"
              >
            </div>

            <div class="field">
              <label for="recipientPhone">전화번호 *</label>
              <input
                id="recipientPhone"
                name="recipientPhone"
                type="tel"
                autocomplete="tel"
                required
                maxlength="30"
                placeholder="010-0000-0000"
              >
            </div>

            <div class="field">
              <label for="shippingAddress">집 주소 *</label>
              <input
                id="shippingAddress"
                name="shippingAddress"
                type="text"
                autocomplete="street-address"
                required
                maxlength="300"
                placeholder="배송받을 주소를 입력하세요"
              >
            </div>

            <h2 style="margin-top:28px;">결제수단 선택</h2>

            <div class="field">
              <label for="paymentMethod">결제수단 *</label>

              <select
                id="paymentMethod"
                name="paymentMethod"
                required
              >
                <option value="">결제수단을 선택하세요</option>
                <option value="카드결제">카드결제</option>
                <option value="무통장입금">무통장입금</option>
                <option value="네이버페이">네이버페이</option>
                <option value="카카오페이">카카오페이</option>
              </select>
            </div>

            <p class="notice">
              현재는 쇼핑몰 기능 확인을 위한 테스트 결제입니다.
              실제 카드 승인이나 간편결제는 진행되지 않습니다.
            </p>

            <button
              class="full green"
              id="payButton"
              type="submit"
              disabled
            >
              결제하기
            </button>

          </form>
        </section>

        <aside class="checkout-panel">
          <h2>주문 상품</h2>

          <div id="checkoutItems">
            <div class="empty">주문 상품을 불러오는 중입니다.</div>
          </div>

          <div class="checkout-total">
            <span>총 결제 금액</span>
            <strong id="checkoutTotal">0원</strong>
          </div>
        </aside>

      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="db.js"></script>
  <script src="checkout.js"></script>

</body>
</html>
