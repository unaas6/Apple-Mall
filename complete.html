
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e1bab3">
  <title>주문 완료 | Apple Mall</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .complete-card {
      max-width: 680px;
      margin: 55px auto;
      padding: 38px;
      border: 1px solid var(--line);
      border-radius: 22px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .complete-mark {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #edf7e8;
      color: var(--green-dark);
      font-size: 36px;
    }

    .complete-card h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    .complete-details {
      text-align: left;
      background: #faf7f6;
      padding: 18px;
      border-radius: 14px;
      margin: 24px 0;
      line-height: 1.9;
      overflow-wrap: anywhere;
    }

    .complete-actions {
      display: flex;
      gap: 10px;
    }

    .complete-actions a {
      flex: 1;
      text-align: center;
    }

    @media(max-width:550px) {
      .complete-card {
        padding: 24px 16px;
        margin: 30px auto;
      }

      .complete-actions {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div class="topline">Apple Mall · 주문 완료</div>

  <header class="header">
    <div class="wrap nav">
      <a class="logo" href="index.html">🍎 Apple <span>Mall</span></a>
      <a class="pill" href="index.html">쇼핑 계속하기</a>
    </div>
  </header>

  <main class="wrap">
    <section class="complete-card">

      <div class="complete-mark">✓</div>

      <h1>주문이 완료되었습니다.</h1>

      <p class="muted">
        Apple Mall을 이용해 주셔서 감사합니다.
      </p>

      <div id="completeDetails" class="complete-details">
        주문 정보를 확인하고 있습니다.
      </div>

      <p class="notice">
        테스트 주문 완료 화면입니다.
        실제 결제 승인이나 금액 이체는 발생하지 않았습니다.
      </p>

      <div class="complete-actions">
        <a class="pill" href="orders.html">주문 내역 보기</a>

        <a class="pill" href="index.html" style="background:var(--main)">
          쇼핑몰로 돌아가기
        </a>
      </div>

    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="db.js"></script>
  <script src="complete.js"></script>

</body>
</html>
